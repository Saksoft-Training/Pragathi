<h2 class="movies-heading">All Movies</h2>
@if (movies.length === 0) {
<p class="no-movies">No movies available</p>
}
@else
{
<div class="list">
  @for (m of movies; track m.id) {
  <app-movie-card-component [movie]="m" [showDeleteButton]="true" (cardClick)="onCardClick($event)"
    (deleteMovie)="onDeleteMovie($event)" >
  </app-movie-card-component>
  }
</div>
}
